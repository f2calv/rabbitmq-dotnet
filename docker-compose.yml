# =============================================================================
# Local RabbitMQ broker and the producer and consumer samples.
#
#   docker compose up -d                          the broker only
#   docker compose --profile demo up --build      the broker plus both sample applications
#
# Endpoints:
#   AMQP             : localhost:5672
#   Management UI    : http://localhost:15672       guest / guest, the image's local-only default
#
# The samples connect to the host name `rabbitmq`, so they run inside this Compose network.
# =============================================================================

services:
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  producerapp:
    profiles: [ demo ]
    image: rabbitmq-dotnet-producerapp:compose
    build:
      context: .
      dockerfile: src/ProducerApp/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumerapp:
    profiles: [ demo ]
    image: rabbitmq-dotnet-consumerapp:compose
    build:
      context: .
      dockerfile: src/ConsumerApp/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq_data: